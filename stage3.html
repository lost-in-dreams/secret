<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BETSY</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{margin:0;padding:0;background:#05070d;width:100%;height:100%;overflow:hidden;font-family:Georgia, serif;}
canvas{position:absolute;inset:0;}
.message{position:absolute;width:100%;text-align:center;top:65%;transform:translateY(-50%);color:#f28fcf;font-size:clamp(24px,6vw,40px);letter-spacing:0.5px;opacity:0;transition:opacity 2s ease, transform 4s ease;z-index:5;pointer-events:none;}
.visible{opacity:1;}
#fade{position:absolute;inset:0;background:#000;z-index:10;opacity:1;transition:opacity 2s ease;pointer-events:none;}
</style>
</head>
<body>

<canvas id="field"></canvas>
<div class="message" id="finalText">LOVE YOU. SISTER</div>
<div id="fade"></div>

<script>
let stage=3; localStorage.setItem("stage", stage);

const canvas=document.getElementById("field"), ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth; canvas.height=innerHeight;}
resize(); window.addEventListener("resize",resize);

const COUNT=400, particles=[];
for(let i=0;i<COUNT;i++){ 
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        tx:Math.random()*canvas.width,
        ty:Math.random()*canvas.height,
        vx:0,
        vy:0,
        r:Math.random()*1.4+0.4,
        a:Math.random()*0.4+0.25,
        phase:Math.random()*Math.PI*2,
        drift:Math.random()*0.002+0.0005
    }); 
}

let pointer={x:null,y:null};
canvas.addEventListener("mousemove",e=>{pointer.x=e.clientX; pointer.y=e.clientY;});
canvas.addEventListener("touchmove",e=>{pointer.x=e.touches[0].clientX; pointer.y=e.touches[0].clientY;});

const text="LOVE YOU";
const textCanvas=document.createElement("canvas"), tctx=textCanvas.getContext("2d");
textCanvas.width=canvas.width; textCanvas.height=canvas.height;
tctx.fillStyle="white"; tctx.font="bold 12vw Georgia"; tctx.textAlign="center"; tctx.textBaseline="middle";
tctx.fillText(text,canvas.width/2,canvas.height/2);
const imageData=tctx.getImageData(0,0,canvas.width,canvas.height).data;

function assignTargets(){
    const targets=[];
    for(let y=0;y<canvas.height;y+=6){
        for(let x=0;x<canvas.width;x+=6){
            const idx=(y*canvas.width+x)*4;
            if(imageData[idx+3]>128) targets.push({x,y});
        }
    }
    for(let i=0;i<particles.length;i++){
        const t=targets[Math.floor(Math.random()*targets.length)];
        particles[i].tx=t.x; particles[i].ty=t.y;
    }
}

let mergeStarted=false, finalTextShown=false, pulseTime=0, textPulseTime=0;
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    pulseTime+=0.03;
    const pulse=0.6+0.4*Math.sin(pulseTime);

    textPulseTime+=0.009;
    const textPulse=0.5+0.5*Math.sin(textPulseTime);

    particles.forEach(p=>{
        p.phase+=p.drift;
        p.x+=Math.cos(p.phase)*0.08;
        p.y+=Math.sin(p.phase)*0.08;

        if(pointer.x!==null && !mergeStarted){ 
            const dx=pointer.x-p.x, dy=pointer.y-p.y, dist=Math.sqrt(dx*dx+dy*dy)+80; 
            const force=Math.min(0.0006,1/dist); 
            p.vx+=dx*force; p.vy+=dy*force; 
        }

        if(mergeStarted){ p.vx+=(p.tx-p.x)*0.008; p.vy+=(p.ty-p.y)*0.008; }

        p.vx*=0.92; p.vy*=0.92; p.x+=p.vx; p.y+=p.vy;

        const t=(Math.sin(p.phase)+1)/2;
        const r=Math.round(242-t*20), g=Math.round(143+t*30), b=Math.round(207-t*20);

        ctx.shadowBlur = finalTextShown ? 10+20*pulse : 0;
        ctx.shadowColor = `rgba(${r},${g},${b},${0.7*pulse})`;

        ctx.beginPath();
        ctx.fillStyle=`rgba(${r},${g},${b},${p.a})`;
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
        ctx.shadowBlur=0;
    });

    if(mergeStarted && !finalTextShown){
        let settled=0; 
        particles.forEach(p=>{if(Math.abs(p.x-p.tx)<2&&Math.abs(p.y-p.ty)<2) settled++;});
        if(settled>particles.length*0.7){ 
            const finalText=document.getElementById("finalText");
            finalText.classList.add("visible"); 
            finalTextShown=true; 
        }
    }

    if(finalTextShown){
        const finalText=document.getElementById("finalText");
        finalText.style.textShadow = `
            0 0 ${5*textPulse}px #f28fcf,
            0 0 ${25*textPulse}px #f28fcf,
            0 0 ${45*textPulse}px #f28fcf
        `;
    }

    requestAnimationFrame(draw);
}
draw();

setTimeout(()=>{ assignTargets(); mergeStarted=true; },3000);

const fade=document.getElementById("fade");
setTimeout(()=>{fade.style.opacity=0;},100);

function transitionToNext(url){
    fade.style.opacity=1;
    setTimeout(()=>{ window.location.href=url; },4000);
}
</script>
</body>
</html>

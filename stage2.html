<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YOU</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070d;font-family:Georgia, serif;}
canvas{position:absolute;inset:0;display:block;}
.message{position:absolute;width:100%;text-align:center;top:50%;transform:translateY(-50%);color:#eaeaf5;font-size:clamp(18px,5vw,26px);letter-spacing:0.5px;opacity:0;transition:opacity 2s ease, transform 4s ease;z-index:5;pointer-events:none;}
.small{font-size:clamp(14px,4vw,18px);}
.lower{top:50%;}
.visible{opacity:1;}
#fade{
    position:absolute;
    inset:0;
    background:#000;
    z-index:100;
    opacity:1;
    pointer-events:none;
}
</style>
</head>
<body>

<canvas id="field"></canvas>
<div class="message" id="t1">You came back</div>
<div class="message small" id="t2">(move your finger)</div>
<div class="message small lower" id="t3">Not everything waits.<br>Some things respond.</div>
<div id="fade"></div>

<script>
let stage=2; localStorage.setItem("stage", stage);

const canvas=document.getElementById("field"), ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth; canvas.height=innerHeight;}
resize(); window.addEventListener("resize",resize);

const COUNT=300, particles=[];
for(let i=0;i<COUNT;i++){ 
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        ox:Math.random()*canvas.width,
        oy:Math.random()*canvas.height,
        vx:0, vy:0,
        r:Math.random()*1.4+0.4,
        a:Math.random()*0.4+0.25,
        phase:Math.random()*Math.PI*2,
        drift:Math.random()*0.002+0.0007,
        dispersed:false
    }); 
}

let pointer={x:null,y:null}, interactionEnergy=0, interactionEnabled=false, readyForFinal=false, extraInteraction=0;
let cinematic=false, cinematicStep=0, cinematicTarget={x:canvas.width/2,y:canvas.height/2};
function easeInOutQuad(t){ return t<0.5?2*t*t:-1+(4-2*t)*t; }
function easeOutQuad(t){ return t*(2-t); }

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        p.phase+=p.drift;
        p.ox+=Math.cos(p.phase)*0.15; p.oy+=Math.sin(p.phase)*0.15;
        if(cinematic){
            if(cinematicStep===0){
                const dx=cinematicTarget.x-p.x, dy=cinematicTarget.y-p.y, dist=Math.sqrt(dx*dx+dy*dy);
                const t=Math.min(dist/300,1), force=0.02*easeInOutQuad(t);
                p.vx+=dx*force; p.vy+=dy*force;
                if(dist<2) cinematicStep=1;
            } else if(cinematicStep===1 && !p.dispersed){
                const angle=Math.random()*Math.PI*2, speed=Math.random()*2+0.5;
                p.vx=Math.cos(angle)*speed*easeOutQuad(0.5+Math.random()/2);
                p.vy=Math.sin(angle)*speed*easeOutQuad(0.5+Math.random()/2);
                p.dispersed=true;
            }
        } else if(interactionEnabled && pointer.x!==null){
            const dx=pointer.x-p.x, dy=pointer.y-p.y, dist=Math.sqrt(dx*dx+dy*dy)+50, force=Math.min(0.0018,1/dist);
            p.vx+=dx*force; p.vy+=dy*force;
            interactionEnergy+=force;
            if(readyForFinal) extraInteraction+=force;
        }
        p.vx+=(p.ox-p.x)*0.00035; p.vy+=(p.oy-p.y)*0.00035;
        p.vx*=0.96; p.vy*=0.96; p.x+=p.vx; p.y+=p.vy;
        const tCol=(Math.sin(p.phase)+1)/2, r=Math.round(200+tCol*55), g=Math.round(210-tCol*90), b=Math.round(255-tCol*95);
        ctx.beginPath(); ctx.fillStyle=`rgba(${r},${g},${b},${p.a})`; ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(draw);
}
draw();

canvas.addEventListener("mousemove",e=>{pointer.x=e.clientX; pointer.y=e.clientY;});
canvas.addEventListener("touchmove",e=>{const t=e.touches[0]; pointer.x=t.clientX; pointer.y=t.touches[0].clientY;});


const t1=document.getElementById("t1"), t2=document.getElementById("t2"), t3=document.getElementById("t3");

const fade=document.getElementById("fade");
setTimeout(()=>{ fade.style.transition='opacity 3s ease'; fade.style.opacity=0; },200); // рассвет

setTimeout(()=>{ t1.classList.add("visible"); }, 1000);
setTimeout(()=>{
    t1.classList.remove("visible");
    setTimeout(()=>{
        t2.classList.add("visible");
        interactionEnabled=true; readyForFinal=true; extraInteraction=0;
    }, 2000);
}, 6000);

const checkInteraction = setInterval(() => {
    if(extraInteraction > 200){
        t2.classList.remove("visible");
        cinematic = true; cinematicStep = 0; particles.forEach(p => p.dispersed = false);
        setTimeout(() => {
            t3.classList.add("visible");
            t3.style.transform = "translateY(-50%) scale(1.25)";
            localStorage.setItem("stage", 3);

            setTimeout(() => {
                fade.style.transition = 'opacity 0.8s ease';
                fade.style.opacity = 1;
                setTimeout(() => { window.location.href="stage3.html"; }, 800);
            }, 2000);

        }, 2000);
        clearInterval(checkInteraction);
    }
}, 200);

</script>
</body>
</html>

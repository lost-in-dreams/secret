<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #05070d;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, serif;
}

/* ---------- CANVAS ---------- */
canvas { position: absolute; inset: 0; }

/* ---------- FADE-IN OVERLAY ---------- */
#startOverlay {
    position:fixed;
    inset:0;
    background:#05070d;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:20;
    cursor:pointer;
}
#startButton {
    padding: 20px 40px;
    background: linear-gradient(135deg, #ff8ca7, #ff4f7b);
    border-radius: 30px;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
    text-align: center;
    user-select: none;
    transition: opacity 1.5s ease, transform 0.3s ease;
}
#startButton:active { transform: scale(0.95); }

/* ---------- TEXT ---------- */
.container {
    position: absolute;
    top: 10%;
    width: 100%;
    text-align: center;
    z-index: 5;
    padding: 0 16px;
    box-sizing: border-box;
}
.text-main, .text-sub {
    color: #eaeaf5;
    opacity: 0;
    visibility: hidden;
    line-height: 1.6;
    letter-spacing: 0.4px;
    transition: opacity 8s ease;
}
.text-main { font-size: clamp(16px,4vw,18px); }
.text-sub {
    margin-top: 18px;
    font-weight: bold;
    font-size: clamp(14px,3.5vw,16px);
}

/* ---------- FADE OUT ---------- */
.fadeout {
    position: absolute;
    inset: 0;
    background: #05070d;
    opacity: 0;
    pointer-events: none;
    animation: darken 10s ease forwards;
    animation-delay: 900s;
    z-index: 10;
}
@keyframes darken { to { opacity: 1; } }
</style>
</head>

<body>

<canvas id="stars"></canvas>
<canvas id="snow"></canvas>
<canvas id="heart"></canvas>

<div class="container">
    <div class="text-main" id="text1">
        time answers softly.<br><br>
        what passed did not disappear.<br>
        it learned how to be quiet.<br><br>
    </div>
    <div class="text-sub" id="text2">
        Special for Betsy. With best wishes.
    </div>
</div>

<div class="fadeout"></div>

<!-- ---------- AUDIO ---------- -->
<audio id="ambient" loop>
    <source src="Snow-Buried-Tales.mp3" type="audio/mpeg">
</audio>

<!-- ---------- START BUTTON ---------- -->
<div id="startOverlay">
    <div id="startButton">НАЖМИ</div>
</div>

<script>
/* ---------- TEXT TIMING ---------- */
const text1 = document.getElementById("text1");
const text2 = document.getElementById("text2");

function showText(el, delay) {
    setTimeout(() => {
        el.style.visibility = "visible";
        el.style.opacity = 1;
    }, delay);
}

/* ---------- STARS ---------- */
const starC = document.getElementById("stars");
const stx = starC.getContext("2d");
function resizeStars() { starC.width = innerWidth; starC.height = innerHeight; }
resizeStars(); window.addEventListener("resize", resizeStars);

const stars = Array.from({length:140}, ()=>({
    x: Math.random()*starC.width,
    y: Math.random()*starC.height,
    r: Math.random()*1.2 + 0.3,
    base: Math.random()*0.4 + 0.2,
    phase: Math.random()*Math.PI*2,
    speed: Math.random()*0.002 + 0.0005,
    flash: Math.random()*600 + 400
}));

function drawStars() {
    stx.clearRect(0,0,starC.width,starC.height);
    stars.forEach(s=>{
        s.phase += s.speed;
        s.flash -= 1;
        let alpha = s.base + Math.sin(s.phase)*0.3;
        if (s.flash < 0) { alpha += 0.6; s.flash = Math.random()*800+400; }
        stx.fillStyle = `rgba(255,255,255,${alpha})`;
        stx.beginPath();
        stx.arc(s.x,s.y,s.r,0,Math.PI*2); stx.fill();
    });
    requestAnimationFrame(drawStars);
}

/* ---------- WIND EFFECT ---------- */
let windOffset = 0;
function updateWind() { windOffset = Math.sin(Date.now()*0.001)*15; requestAnimationFrame(updateWind); }
updateWind();

/* ---------- SNOW ---------- */
const snowC = document.getElementById("snow");
const sctx = snowC.getContext("2d");
function resizeSnow(){ snowC.width = innerWidth; snowC.height = innerHeight; }
resizeSnow(); window.addEventListener("resize", resizeSnow);

let snowAlpha = 0;
const snow = Array.from({length:90}, ()=>({
    x: Math.random()*snowC.width,
    y: Math.random()*snowC.height,
    r: Math.random()*2+1,
    d: Math.random()*0.6+0.3
}));

function drawSnow(){
    snowAlpha = Math.min(0.6, snowAlpha + 0.002);
    sctx.clearRect(0,0,snowC.width,snowC.height);
    sctx.fillStyle = `rgba(255,255,255,${snowAlpha})`;
    snow.forEach(f=>{
        sctx.beginPath();
        sctx.arc(f.x + windOffset, f.y, f.r,0,Math.PI*2);
        sctx.fill();
        f.y += f.d;
        if(f.y > snowC.height){ f.y=-5; f.x=Math.random()*snowC.width; }
    });
    requestAnimationFrame(drawSnow);
}

/* ---------- HEART ---------- */
const hC = document.getElementById("heart");
const htx = hC.getContext("2d");
function resizeHeart(){ hC.width=innerWidth; hC.height=innerHeight; }
resizeHeart(); window.addEventListener("resize", resizeHeart);

let t=0, appear=0;
function drawHeart(){
    htx.clearRect(0,0,hC.width,hC.height);
    appear=Math.min(1,appear+0.002);
    htx.save();
    htx.translate(hC.width/2,hC.height/2+40);
    const pulse = 1 + Math.sin(t)*0.03;
    htx.scale(9*pulse,9*pulse);
    htx.beginPath();
    for(let i=0;i<Math.PI*2;i+=0.01){
        const x=16*Math.pow(Math.sin(i),3);
        const y=13*Math.cos(i)-5*Math.cos(2*i)-2*Math.cos(3*i)-Math.cos(4*i);
        htx.lineTo(x,-y);
    }
    htx.closePath();
    htx.shadowColor="rgba(255,120,150,0.6)";
    htx.shadowBlur=30;
    htx.fillStyle=`rgba(255,140,170,${0.6*appear})`;
    htx.fill();
    htx.restore();
    t+=0.02;
    requestAnimationFrame(drawHeart);
}

/* ---------- AUDIO FADE-IN ---------- */
const ambient = document.getElementById("ambient");
function fadeInAudio(audio, targetVolume=0.2,duration=5000){
    audio.volume=0;
    audio.play().catch(e=>console.log("Audio play blocked:",e));
    const step=0.01;
    const interval=duration/(targetVolume/step);
    const fade=setInterval(()=>{
        if(audio.volume<targetVolume) audio.volume=Math.min(audio.volume+step,targetVolume);
        else clearInterval(fade);
    },interval);
}

/* ---------- START BUTTON ---------- */
const overlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startButton');

startBtn.addEventListener('click',()=>{
    // плавное исчезновение кнопки
    startBtn.style.opacity=0;
    overlay.style.transition="opacity 1.5s ease";
    overlay.style.opacity=0;
    setTimeout(()=>{ overlay.style.display="none"; },1500);

    // запуск аудио
    fadeInAudio(ambient,0.15,8000);

    // запуск анимаций с плавным появлением
    drawStars(); drawHeart(); drawSnow();
    
    // показать текст постепенно
    showText(text1, 5000);
    showText(text2, 10000);
});
</script>

</body>
</html>

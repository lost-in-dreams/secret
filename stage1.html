<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LOVE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070d;font-family:Georgia, serif;color:#eaeaf5;}
canvas{position:absolute;inset:0;display:block;}
#text{position:absolute;bottom:18%;width:100%;text-align:center;font-size:clamp(16px,4vw,18px);line-height:1.8;letter-spacing:0.4px;opacity:0;transition:opacity 6s ease;z-index:5;}
#fade{position:absolute;inset:0;background:#000;opacity:1;transition:opacity 2s ease;pointer-events:none;z-index:10;}
</style>
</head>
<body>

<canvas id="field"></canvas>
<div id="text"></div>
<div id="fade"></div>

<script>
let stage=1; localStorage.setItem("stage", stage);

const canvas=document.getElementById("field"), ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth; canvas.height=innerHeight;}
resize(); window.addEventListener("resize",resize);

let particles=[];
function addParticle(x,y){particles.push({x,y,r:Math.random()*1.5+0.5,a:1,dx:(Math.random()-0.5)*0.3,dy:(Math.random()-0.5)*0.3,huePhase:Math.random()*Math.PI*2,hueSpeed:Math.random()*0.015+0.005});}

function draw(){
    ctx.fillStyle="rgba(5,7,13,0.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        p.huePhase+=p.hueSpeed;
        const t=(Math.sin(p.huePhase)+1)/2;
        const r=Math.round(200+t*(255-200)), g=Math.round(210+t*(105-210)), b=Math.round(255+t*(160-255));
        ctx.fillStyle=`rgba(${r},${g},${b},${p.a})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        p.x+=p.dx; p.y+=p.dy; p.a-=0.003;
    });
    for(let i=particles.length-1;i>=0;i--){if(particles[i].a<=0) particles.splice(i,1);}
    requestAnimationFrame(draw);
}
draw();

window.addEventListener("mousemove",e=>addParticle(e.clientX,e.clientY));
window.addEventListener("touchmove",e=>addParticle(e.touches[0].clientX,e.touches[0].clientY));

const text=document.getElementById("text");
setTimeout(()=>{text.innerHTML="You’re here. Thank you!"; text.style.opacity=1;},2000);
setTimeout(()=>{text.style.opacity=0; setTimeout(()=>{ text.innerHTML="Some things don’t need to be named..."; text.style.opacity=1; },6000);},10000);

const fade=document.getElementById("fade");
setTimeout(()=>{fade.style.opacity=0;},100);

function transitionToNext(url){
    fade.style.opacity=1;
    setTimeout(()=>{ window.location.href=url; },4000);
}

setTimeout(()=>{ transitionToNext("stage2.html"); },35000);
</script>
</body>
</html>
